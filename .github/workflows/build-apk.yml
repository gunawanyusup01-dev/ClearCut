name: Build ClearCut APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 assembleDebug --no-daemon


      - name: Upload APK variants
        uses: actions/upload-artifact@v4
        with:
          name: ClearCut-APK-Variants
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: warn
          retention-days: 7

